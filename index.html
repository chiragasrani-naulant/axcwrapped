<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Aditi × Chirag · Wrapped</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E4003A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@500;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--red:#E4003A;--cream:#F3EBDD;--ink:#1B0A10;
  --disp:"Anton","Impact","Arial Narrow",sans-serif;--sans:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;--ser:"Instrument Serif",Georgia,serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--ink);font-family:var(--sans);overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
.amb{position:fixed;inset:0;background:var(--ag,#E4003A);opacity:.55;filter:blur(70px);transform:scale(1.2);transition:background .6s}
.wrap{position:relative;height:100%;display:grid;place-items:center}
.story{position:relative;height:min(100%,900px);aspect-ratio:9/16;max-width:100%;overflow:hidden;border-radius:26px;container-type:inline-size;box-shadow:0 30px 80px rgba(0,0,0,.45);background:var(--ink);touch-action:manipulation;--bf:#F3EBDD}
@media (max-width:520px){.story{border-radius:0;height:100%;width:100%;aspect-ratio:auto}}
.bars{position:absolute;top:10px;left:10px;right:10px;display:flex;gap:3px;z-index:6}
.bars i{flex:1;height:3px;border-radius:3px;background:color-mix(in srgb,var(--bf) 30%,transparent);overflow:hidden}
.bars i b{display:block;height:100%;width:0;background:var(--bf)}
.bars i.done b,.bars i.cur.stat b{width:100%;animation:none}
.bars i.cur b{animation:fill var(--t) linear forwards}
.paused .bars i.cur b{animation-play-state:paused}
@keyframes fill{to{width:100%}}
.hint{position:absolute;bottom:calc(14px + env(safe-area-inset-bottom,0px));left:0;right:0;text-align:center;font:700 .62rem var(--sans);letter-spacing:.2em;text-transform:uppercase;color:var(--bf);z-index:6;pointer-events:none;transition:opacity .4s}

/* slide + themes */
.slide{position:absolute;inset:0;background:var(--bg);color:var(--fg);--ln:color-mix(in srgb,var(--fg) 45%,transparent);opacity:0;visibility:hidden;transition:opacity .5s,visibility 0s .5s;overflow:hidden}
.slide.on{opacity:1;visibility:visible;transition:opacity .5s}
.red{--bg:var(--red);--fg:var(--cream);--ac:var(--cream)}
.cream{--bg:var(--cream);--fg:var(--red);--ac:var(--ink)}
.ink{--bg:var(--ink);--fg:var(--cream);--ac:var(--red)}
.slide::before{content:"";position:absolute;top:46px;bottom:0;left:8cqw;right:8cqw;border-inline:1px solid var(--ln);pointer-events:none}
.nav{position:absolute;top:20px;left:0;right:0;height:27px;display:flex;justify-content:space-between;align-items:center;padding:0 8cqw;border-bottom:1px solid var(--ln);font:700 max(.6rem,2.6cqw) var(--sans);letter-spacing:.18em;text-transform:uppercase}
.rail{position:absolute;top:47px;bottom:0;width:8cqw;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:16px 0;font:700 max(.52rem,2.2cqw) var(--sans);letter-spacing:.18em;text-transform:uppercase;writing-mode:vertical-rl;white-space:nowrap}
.rail.l{left:0;transform:rotate(180deg)}.rail.r{right:0}
.body{position:absolute;left:8cqw;right:8cqw;top:47px;bottom:0;padding:5cqw 7cqw 7cqw;display:flex;flex-direction:column;justify-content:center}
.body>*{position:relative}

/* type */
.d{font-family:var(--disp);font-weight:400;text-transform:uppercase;line-height:.92;margin:0}
.d1{font-size:clamp(3rem,21cqw,6.6rem)}.d2{font-size:clamp(2.2rem,15cqw,4.8rem)}.d3{font-size:clamp(1.6rem,10.5cqw,3.4rem)}
.lab{font:700 max(.6rem,2.6cqw)/1.2 var(--sans);letter-spacing:.18em;text-transform:uppercase;opacity:.85;margin:0 0 3cqw}
.p{font:500 max(.9rem,3.9cqw)/1.5 var(--sans);max-width:34ch;margin:3cqw 0 0}
.ser{font-family:var(--ser);font-style:italic;font-weight:400;font-size:max(1.25rem,6cqw);line-height:1.25;max-width:24ch;margin:3cqw 0 0}
.ac{color:var(--ac)}
.ln{display:block;overflow:hidden;padding:.05em 0}
.ln>span{display:block;transform:translateY(112%)}
.on .ln>span{animation:rev .95s cubic-bezier(.2,.85,.2,1) both;animation-delay:calc(var(--d,0)*1s)}
@keyframes rev{from{transform:translateY(112%)}to{transform:none}}
.in{opacity:0}
.on .in{animation:up .85s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--d,0)*1s)}
.on .pop{animation-name:pop;animation-duration:.9s;animation-timing-function:cubic-bezier(.2,1.4,.4,1)}
.on .sl{animation-name:sl}.on .sr{animation-name:sr}
@keyframes up{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.3) rotate(-14deg)}to{opacity:1;transform:rotate(var(--r,0deg))}}
@keyframes sl{from{opacity:0;transform:translateX(-80px) rotate(-8deg)}to{opacity:1;transform:rotate(-2deg)}}
@keyframes sr{from{opacity:0;transform:translateX(80px) rotate(8deg)}to{opacity:1;transform:rotate(2deg)}}
.bob{display:inline-block}.on .bob{animation:bob 3s ease-in-out infinite;animation-delay:var(--b,0s)}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-5deg)}50%{transform:translateY(-9px) rotate(5deg)}}
.fl{position:absolute;bottom:-50px;opacity:0;pointer-events:none;color:var(--fg)}
.on .fl{animation:rise var(--t) linear infinite;animation-delay:var(--dl)}
@keyframes rise{0%{transform:translateY(0) rotate(0);opacity:0}12%{opacity:.5}100%{transform:translateY(-120vh) rotate(50deg);opacity:0}}

/* components */
.fr{--n:13px;--cp:polygon(var(--n) 0,calc(100% - var(--n)) 0,100% var(--n),100% calc(100% - var(--n)),calc(100% - var(--n)) 100%,var(--n) 100%,0 calc(100% - var(--n)),0 var(--n));background:var(--fg);clip-path:var(--cp);padding:1.5px;margin:3cqw 0}
.fr>div{background:var(--bg);clip-path:var(--cp);padding:5cqw 6cqw}
.stk{width:25cqw;height:25cqw;border-radius:50%;background:var(--fg);color:var(--bg);display:grid;place-items:center;text-align:center;font:400 max(1rem,5.4cqw)/1 var(--disp);text-transform:uppercase;--r:10deg;transform:rotate(10deg)}
.stk b{display:block;font-weight:400;font-size:1.9em}
.mq{margin:4cqw -7cqw;border-block:1px solid var(--ln);overflow:hidden;white-space:nowrap;font:400 max(1.4rem,7.4cqw) var(--disp);text-transform:uppercase;padding:1.6cqw 0}
.mq div{display:inline-block}.on .mq div{animation:mq 14s linear infinite}
@keyframes mq{to{transform:translateX(-50%)}}
.tiles{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--ln);margin:3cqw 0}
.tile{aspect-ratio:1.1;display:grid;place-items:center;font-size:15cqw;border:1px solid var(--ln)}
.stats{display:grid;grid-template-columns:1fr 1fr;margin:2cqw 0}
.stats div{padding:2.4cqw 1.5cqw;border-top:1px solid var(--ln)}
.stats small{display:block;font:700 max(.52rem,2.2cqw) var(--sans);letter-spacing:.16em;text-transform:uppercase;opacity:.8;margin-bottom:.8cqw}
.stats b{font:400 max(1.05rem,5.4cqw)/1.1 var(--disp);text-transform:uppercase;display:block}
.num3{display:grid;grid-template-columns:auto 1fr;gap:4cqw;align-items:baseline;padding:3.6cqw 0;border-top:1px solid var(--ln);font:700 max(.95rem,4.2cqw)/1.3 var(--sans)}
.num3 b{font:400 11cqw/1 var(--disp);opacity:.9}
.meter{height:3.4cqw;border:1px solid var(--fg);margin:3cqw 0 1.5cqw;overflow:hidden}.meter i{display:block;height:100%;width:0;background:var(--fg)}
.on .meter i{animation:grow 2.2s .9s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes grow{to{width:100%}}
.ringwrap{position:relative;width:54cqw;margin:1cqw 0 2cqw}
.ring{width:100%;display:block}.ring circle{fill:none;stroke-width:9;stroke-linecap:round}
.ring .tr{stroke:var(--ln)}.ring .pr{stroke:var(--fg);stroke-dasharray:565;stroke-dashoffset:565;transform:rotate(-90deg);transform-origin:50% 50%}
.on .ring .pr{animation:ringf 2.4s .5s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes ringf{to{stroke-dashoffset:44}}
.ringwrap .mid{position:absolute;inset:0;display:grid;place-content:center;text-align:center;font:400 13cqw/1 var(--disp)}
.crest{width:19cqw;color:var(--fg);display:block}.on .crest{animation:spin 24s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.ghost{position:absolute!important;right:-6cqw;top:8cqw;font:400 78cqw/1 var(--disp);color:var(--fg);opacity:.08;pointer-events:none}
.arch{flex:1;min-height:0;aspect-ratio:3/4;max-width:100%;align-self:center;margin:-7cqw 0 0;border-radius:999px 999px 0 0;overflow:hidden;background:var(--cream);position:relative;z-index:2}
.arch img{width:100%;height:100%;object-fit:cover;object-position:50% 14%;filter:grayscale(1) contrast(1.25) brightness(1.08);mix-blend-mode:multiply;display:block}
.arch::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 45%,var(--red));mix-blend-mode:multiply}
.x{position:absolute!important;left:2cqw;top:41%;z-index:3;width:15cqw;height:15cqw;border-radius:50%;background:var(--cream);color:var(--red);display:grid;place-items:center;font:400 9cqw/1 var(--disp);--r:-12deg}
.tape{position:absolute!important;left:-6cqw;right:-6cqw;bottom:13cqw;z-index:4;background:var(--cream);color:var(--red);font:400 max(1.1rem,5.4cqw) var(--disp);letter-spacing:.06em;text-transform:uppercase;padding:2cqw 0;text-align:center;white-space:nowrap;transform:rotate(-5deg);--r:-5deg}
.btn{font:700 max(.8rem,3.4cqw) var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--bg);background:var(--fg);border:0;padding:3.2cqw 5cqw;cursor:pointer;margin-top:2cqw;align-self:flex-start;transition:transform .2s}
.btn:hover{transform:translateY(-2px)}.btn:active{transform:scale(.97)}
.btn.o{background:none;color:var(--fg);box-shadow:inset 0 0 0 1.5px var(--fg)}
.btn:focus-visible,.nv:focus-visible{outline:3px solid var(--cream);outline-offset:3px}
.btns{display:flex;gap:3cqw;flex-wrap:wrap}
.nv{position:fixed;top:50%;width:48px;height:48px;margin-top:-24px;border:1px solid rgba(255,255,255,.35);background:rgba(0,0,0,.25);color:#fff;font-size:1.3rem;cursor:pointer;display:none;transition:background .2s,transform .2s;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.nv:hover{background:rgba(0,0,0,.5);transform:scale(1.08)}
#pv{left:max(16px,calc(50% - min(28.125vh,253px) - 72px))}#nx{right:max(16px,calc(50% - min(28.125vh,253px) - 72px))}
@media (min-width:900px){.nv{display:block}}
@media (max-height:700px){.body{padding-top:3cqw;padding-bottom:5cqw}.p{margin-top:2cqw}.ser{margin-top:2cqw}}
@media (prefers-reduced-motion:reduce){.on .in,.on .ln>span,.on .fl,.on .bob,.on .mq div,.on .crest{animation-duration:.01s!important;animation-iteration-count:1!important}}

/* ===== music button (follows each slide's theme) ===== */
.story{--bb:#E4003A}
.mus{position:absolute;z-index:7;top:calc(47px + 2.4cqw);right:calc(8cqw + 3.2cqw);padding:0;border:0;background:none;cursor:pointer;-webkit-tap-highlight-color:transparent;font:inherit}
.mus::after{content:"";position:absolute;inset:-8px}
.mus .mi{--n:max(6px,1.8cqw);display:flex;align-items:center;gap:max(7px,2.2cqw);height:max(30px,8.6cqw);padding:0 max(10px,3cqw);background:var(--bf);color:var(--bb);transition:background .5s,color .5s,transform .2s;
  clip-path:polygon(var(--n) 0,calc(100% - var(--n)) 0,100% var(--n),100% calc(100% - var(--n)),calc(100% - var(--n)) 100%,var(--n) 100%,0 calc(100% - var(--n)),0 var(--n))}
.mus:hover .mi{transform:translateY(-2px)}.mus:active .mi{transform:scale(.95)}
.mus:focus-visible{outline:3px solid var(--bf);outline-offset:3px}
.mus svg{display:block;width:max(13px,3.8cqw);height:max(13px,3.8cqw);fill:currentColor}
.mus .pa{display:none}.mus.playing .pa{display:block}.mus.playing .pl{display:none}
.eq{display:flex;align-items:flex-end;gap:max(2px,.6cqw);height:max(11px,3.2cqw)}
.eq i{display:block;width:max(2px,.7cqw);height:100%;background:currentColor;transform:scaleY(.28);transform-origin:50% 100%;transition:transform .3s}
.playing .eq i{animation:eqb 1.05s ease-in-out infinite}
.playing .eq i:nth-child(2){animation-duration:.8s;animation-delay:-.35s}
.playing .eq i:nth-child(3){animation-duration:1.2s;animation-delay:-.7s}
.playing .eq i:nth-child(4){animation-duration:.9s;animation-delay:-.2s}
@keyframes eqb{0%,100%{transform:scaleY(.25)}50%{transform:scaleY(1)}}
.paused .eq i{animation-play-state:paused}
@media (prefers-reduced-motion:reduce){.playing .eq i{animation:none;transform:scaleY(.7)}}
</style>
</head>
<body>
<div class="amb" id="amb"></div>
<div class="wrap">
  <div class="story" id="story">
    <div class="bars" id="bars"></div>
    <div id="slides"></div>
    <div class="hint" id="hint">tap to continue · hold to pause · sound on ♪</div>
    <button class="mus" id="mus" type="button" title="Rangeen · Hasan Raheem" aria-label="Play music" aria-pressed="false"><span class="mi"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="pl" d="M8 5v14l11-7z"/><g class="pa"><rect x="6" y="5" width="4.2" height="14"/><rect x="13.8" y="5" width="4.2" height="14"/></g></svg><span class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i></span></span></button>
  </div>
</div>
<button class="nv" id="pv" type="button" aria-label="Previous">←</button>
<button class="nv" id="nx" type="button" aria-label="Next">→</button>

const DUR=7500, TH={red:["#F3EBDD","#E4003A"],cream:["#E4003A","#F3EBDD"],ink:["#F3EBDD","#1B0A10"]};
/* ============================================ */

const $=id=>document.getElementById(id);
const slides=$("slides"), bars=$("bars"), story=$("story"), amb=$("amb");
let cur=-1, held=false;
const rnd=(a,b)=>a+Math.random()*(b-a), pad=n=>String(n).padStart(2,"0");

S.forEach((s,i)=>{
  const el=document.createElement("section"); el.className="slide "+s.th;
  let fl=""; if(s.fl) for(let k=0;k<10;k++) fl+=`<span class="fl" style="left:${rnd(10,90)}%;font-size:${rnd(18,38)}px;--t:${rnd(7,12)}s;--dl:${rnd(0,6)}s">${s.fl}</span>`;
  el.innerHTML=`${fl}<div class="nav"><span>Aditi</span><span>Wrapped</span><span>Chirag</span></div>
   <div class="rail l"><span>Aditi × Chirag</span><span>${pad(i+1)} / ${pad(S.length)}</span></div>
   <div class="rail r"><span>${s.ch}</span><span>Wrapped 2026</span></div>
   <div class="body">${s.html}</div>`;
  slides.appendChild(el);
  const b=document.createElement("i"); b.innerHTML="<b></b>"; bars.appendChild(b);
});
const els=[...slides.children], segs=[...bars.children];

function count(el){
  const to=+el.dataset.to, suf=el.dataset.suf||"", t0=performance.now()+(+el.dataset.delay||0)*1000;
  (function f(t){ const p=Math.min(1,Math.max(0,(t-t0)/1500)), e=1-Math.pow(1-p,3); el.textContent=Math.round(to*e)+suf; if(p<1) requestAnimationFrame(f); })(performance.now());
}
function show(n){
  n=Math.max(0,Math.min(S.length-1,n)); if(n===cur) return;
  cur=n; story.classList.remove("paused");
  els.forEach((e,i)=>e.classList.toggle("on",i===n));
  segs.forEach((b,i)=>{ b.className=i<n?"done":i===n?"cur":""; b.style.removeProperty("--t");
    if(i===n){ const a=S[n].t===undefined?DUR:S[n].t; if(a) b.style.setProperty("--t",a+"ms"); else b.classList.add("stat"); } });
  els[n].querySelectorAll("[data-to]").forEach(count);
  const th=TH[S[n].th]; story.style.setProperty("--bf",th[0]); story.style.setProperty("--bb",th[1]); amb.style.setProperty("--ag",S[n].th==="red"?"#E4003A":S[n].th==="cream"?"#F3EBDD":"#5a1426");
  $("hint").style.opacity=n===0?.9:0;
}
const next=()=>show(cur+1), prev=()=>show(cur-1);
segs.forEach(b=>b.addEventListener("animationend",()=>{ if(b.classList.contains("cur")) next(); }));

let ht=null;
story.addEventListener("pointerdown",e=>{ if(e.target.closest("button")) return; held=false; ht=setTimeout(()=>{held=true;story.classList.add("paused");hold(true);},220); });
story.addEventListener("pointerup",e=>{ clearTimeout(ht); if(held){ story.classList.remove("paused"); held=false; hold(false); return; }
  if(e.target.closest("button")) return;
  const r=story.getBoundingClientRect(); (e.clientX-r.left)<r.width*.3?prev():next(); });
story.addEventListener("pointercancel",()=>{clearTimeout(ht); story.classList.remove("paused"); held=false; hold(false);});
story.addEventListener("contextmenu",e=>e.preventDefault());
document.addEventListener("keydown",e=>{ if(e.key==="ArrowRight"||e.key===" "){e.preventDefault();next();} if(e.key==="ArrowLeft") prev(); });
$("nx").onclick=next; $("pv").onclick=prev;
$("replay").addEventListener("click",()=>{show(0);restartSong();});

/* ===== download the stats card as a PNG ===== */
async function makeCard(){
  try{ await Promise.all([document.fonts.load("100px Anton"),document.fonts.load("700 30px Archivo")]); }catch(e){}
  const W=1080,H=1350,c=document.createElement("canvas"); c.width=W; c.height=H; const x=c.getContext("2d");
  const RED="#E4003A",CR="#F3EBDD",INK="#1B0A10";
  const notch=(a,b,w,h,n)=>{x.beginPath();x.moveTo(a+n,b);x.lineTo(a+w-n,b);x.lineTo(a+w,b+n);x.lineTo(a+w,b+h-n);x.lineTo(a+w-n,b+h);x.lineTo(a+n,b+h);x.lineTo(a,b+h-n);x.lineTo(a,b+n);x.closePath();};
  x.fillStyle=RED; x.fillRect(0,0,W,H);
  notch(50,50,W-100,H-100,44); x.fillStyle=CR; x.fill();
  notch(84,84,W-168,H-168,34); x.strokeStyle=RED; x.lineWidth=3; x.stroke();
  x.save(); x.translate(W/2,212); x.fillStyle=RED;
  for(let i=0;i<8;i++){ x.rotate(Math.PI/4); x.beginPath(); x.ellipse(0,-66,31,52,0,0,7); x.fill(); }
  x.fillStyle=CR; x.beginPath(); x.arc(0,0,42,0,7); x.fill();
  x.fillStyle=RED; x.font="46px Archivo, sans-serif"; x.textAlign="center"; x.textBaseline="middle"; x.fillText("♥",0,3); x.restore();
  x.textAlign="center"; x.textBaseline="alphabetic";
  const fit=(t,tpl,max,size)=>{ do{ x.font=tpl.replace("{s}",size); size-=2; }while(x.measureText(t).width>max&&size>18); };
  x.fillStyle=RED; fit("ADITI × CHIRAG",'{s}px Anton, Impact, sans-serif',820,170); x.fillText("ADITI × CHIRAG",W/2,498);
  x.font="700 30px Archivo, sans-serif"; try{x.letterSpacing="10px";}catch(e){} x.fillText("WRAPPED  ·  2026",W/2,552); try{x.letterSpacing="0px";}catch(e){}
  x.textAlign="left";
  STATS.forEach((s,i)=>{
    const col=i%2, row=Math.floor(i/2), px=130+col*445, py=640+row*140;
    x.strokeStyle=RED; x.globalAlpha=.45; x.lineWidth=2; x.beginPath(); x.moveTo(px,py-34); x.lineTo(px+400,py-34); x.stroke(); x.globalAlpha=1;
    x.fillStyle=RED; x.font="700 22px Archivo, sans-serif"; try{x.letterSpacing="5px";}catch(e){} x.fillText(s[0].toUpperCase(),px,py); try{x.letterSpacing="0px";}catch(e){}
    x.fillStyle=INK; fit(s[1].toUpperCase(),'{s}px Anton, Impact, sans-serif',400,64); x.fillText(s[1].toUpperCase(),px,py+68);
  });
  x.textAlign="center"; x.fillStyle=RED; x.font="700 22px Archivo, sans-serif"; try{x.letterSpacing="6px";}catch(e){}
  x.fillText("MADE BY CHIRAG · ONLY FOR ADITI",W/2,1236);
  return new Promise(r=>c.toBlob(r,"image/png"));
}
const dlBtn=$("dl"), dlLabel=dlBtn.textContent;
dlBtn.addEventListener("click",async()=>{
  dlBtn.textContent="Preparing…";
  try{
    const blob=await makeCard(); let done=false;
    if(window.claude&&claude.use){ const d=await claude.use("downloads"); if(d){ await d.save({filename:"aditi-x-chirag-wrapped.png",data:blob}); done=true; } }
    if(!done){ const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="aditi-x-chirag-wrapped.png"; document.body.appendChild(a); a.click(); a.remove(); }
    dlBtn.textContent="Saved ✓";
  }catch(e){ dlBtn.textContent=(e&&e.code==="declined")?dlLabel:"Couldn’t save · screenshot instead"; }
  setTimeout(()=>dlBtn.textContent=dlLabel,2600);
});
/* ===== background music: Rangeen · Hasan Raheem (starts on the first tap) ===== */
const mus=$("mus"), song=()=>$("song");
let want=false, auto=false, fadeId=0, blobTried=false;
const syncUI=()=>{ mus.classList.toggle("playing",want); mus.setAttribute("aria-pressed",String(want)); mus.setAttribute("aria-label",want?"Pause music":"Play music"); };
function ramp(a,to,ms,done){ cancelAnimationFrame(fadeId); const from=a.volume,t0=performance.now();
  (function f(t){ const p=Math.min(1,Math.max(0,(t-t0)/ms)); a.volume=from+(to-from)*p; if(p<1) fadeId=requestAnimationFrame(f); else if(done) done(); })(t0); }
async function startSong(){
  want=true; syncUI(); const a=song(); if(!a) return;
  cancelAnimationFrame(fadeId);
  if(!a.paused){ ramp(a,1,300); return; }
  try{ a.volume=0; await a.play(); if(want) ramp(a,1,1600); }
  catch(e){ if(e&&e.name==="NotAllowedError"&&want){ want=false; syncUI(); } }
}
function stopSong(){ want=false; syncUI(); const a=song(); if(a&&!a.paused) ramp(a,0,350,()=>{ if(!want) a.pause(); }); }
function hold(on){ const a=song(); if(!a||!want) return;
  if(on){ cancelAnimationFrame(fadeId); a.pause(); }
  else{ a.volume=1; a.play().catch(()=>{}); } }
function restartSong(){ const a=song(); if(!a) return; try{ a.currentTime=0; }catch(e){} if(want&&a.paused) startSong(); }
function musFallback(){ /* if the browser refuses the embedded data, retry from a Blob */
  const a=song(); if(!a) return;
  if(blobTried){ mus.hidden=true; return; } blobTried=true;
  try{ const s=a.getAttribute("src"), bin=atob(s.slice(s.indexOf(",")+1)), u=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i);
    a.src=URL.createObjectURL(new Blob([u],{type:"audio/mpeg"})); a.load(); if(want) startSong();
  }catch(e){ mus.hidden=true; } }
mus.addEventListener("click",e=>{ e.stopPropagation(); auto=true; want?stopSong():startSong(); });
const firstTap=e=>{ if(auto) return;
  if(e.type==="keydown"&&![" ","ArrowRight","ArrowLeft","Enter"].includes(e.key)) return;
  if(e.target.closest&&e.target.closest("#mus")) return;
  auto=true; startSong(); };
["pointerdown","keydown"].forEach(t=>document.addEventListener(t,firstTap,{capture:true}));
document.addEventListener("DOMContentLoaded",()=>{ const a=song(); if(a&&a.error) musFallback(); startSong().then(()=>{ if(want) auto=true; }); }); /* autoplay on open; if the browser blocks it, the first tap starts it */

show(0);
</script>
<audio id="song" preload="auto" loop onerror="musFallback()" src="rangeen.mp3"></audio>
